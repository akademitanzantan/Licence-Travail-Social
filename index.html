<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makandal · Programme de Travail social</title>
<meta name="description" content="Makandal — Programme de licence en travail social (plateforme pédagogique)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('makandal-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
:root{
  --background:#FDFBF7;--background-paper:#FAF6EF;--foreground:#1E293B;--card:#FFFFFF;--card-foreground:#0F172A;
  --primary:#0284C7;--primary-foreground:#FFFFFF;--secondary:#F1F5F9;--secondary-foreground:#0F172A;
  --ochre:#D97706;--sage:#059669;--coral:#E11D48;--muted:#F1F5F9;--muted-foreground:#64748B;
  --destructive:#E11D48;--destructive-foreground:#FFFFFF;--border:#E2E8F0;--ring:#0284C7;--radius:12px;
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-serif:'Cormorant Garamond',Georgia,serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;
}
.dark{
  --background:#0B1120;--background-paper:#111827;--foreground:#F8FAFC;--card:#1E293B;--card-foreground:#F8FAFC;
  --primary:#38BDF8;--primary-foreground:#0F172A;--secondary:#1E293B;--secondary-foreground:#F8FAFC;
  --ochre:#F59E0B;--sage:#10B981;--coral:#FB7185;--muted:#1E293B;--muted-foreground:#94A3B8;
  --destructive:#FB7185;--destructive-foreground:#0F172A;--border:#334155;--ring:#38BDF8;
}
*,*::before,*::after{box-sizing:border-box;border-color:var(--border)}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,h4,p,ul{margin:0}ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
.serif{font-family:var(--font-serif)}.mono{font-family:var(--font-mono)}
.wrap{max-width:80rem;margin:0 auto;padding:0 16px}
.wrap6{max-width:72rem;margin:0 auto;padding:0 16px}
@media(min-width:640px){.wrap,.wrap6{padding:0 24px}}
@media(min-width:1024px){.wrap,.wrap6{padding:0 32px}}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.s5{width:20px;height:20px}svg.i.s6{width:24px;height:24px}svg.i.s10{width:40px;height:40px}svg.i.s35{width:14px;height:14px}
/* header */
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--background) 80%,transparent);border-bottom:1px solid var(--border)}
header.top .in{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--primary);color:var(--primary-foreground)}
.brand .t1{display:block;font-family:var(--font-serif);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand .t2{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--ochre);font-weight:700;line-height:1.2}
.actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);transition:.15s}
.iconbtn:hover{background:var(--secondary)}
.iconbtn.danger:hover{background:var(--destructive);color:var(--destructive-foreground)}
.whoami{display:none;flex-direction:column;align-items:flex-end;line-height:1.25;margin-left:4px}
.whoami b{font-size:14px;font-weight:600}.whoami span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}
@media(min-width:768px){.whoami{display:flex}}
.hide-sm{display:none}@media(min-width:640px){.hide-sm{display:inline}.hide-sm-flex{display:inline-flex!important}}
.hide-sm-flex{display:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;height:36px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;background:var(--primary);color:var(--primary-foreground);border:1px solid var(--primary);transition:.15s}
.btn:hover{filter:brightness(.92)}
.btn.sm{height:32px;padding:0 12px;gap:6px}
.btn.lg{height:44px;padding:0 32px}
.btn.outline{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn.outline:hover{background:var(--secondary);filter:none}
.btn.ghost{background:transparent;color:var(--foreground);border-color:transparent}
.btn.ghost:hover{background:var(--secondary);filter:none}
.btn.icon{width:36px;padding:0}
.btn.full{width:100%}
.input,.textarea,.select{width:100%;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--foreground);font:inherit;font-size:14px;padding:0 12px;height:36px;outline:none;transition:.15s}
.textarea{height:auto;padding:8px 12px;resize:vertical;line-height:1.5;display:block}
.select{padding:0 8px;background:var(--card)}
.input:focus,.textarea:focus,.select:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
.input:disabled{opacity:.5}
.input.pl{padding-left:36px}
label.lbl{font-size:14px;font-weight:500;display:block}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--border);background:linear-gradient(135deg,#082f49,#0f172a 50%,#451a03);color:#fff;padding:32px}
@media(min-width:640px){.hero{padding:48px}}@media(min-width:1024px){.hero{padding:64px}}
.hero .blob,.sidebrand .blob{position:absolute;border-radius:50%;background:rgba(14,165,233,.2);filter:blur(64px);pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:#fcd34d}
.ochre-label{font-size:12px;text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:var(--ochre)}
.hero h1{margin-top:16px;font-family:var(--font-serif);font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
@media(min-width:640px){.hero h1{font-size:48px}}@media(min-width:1024px){.hero h1{font-size:60px}}
.hero h1 em{font-style:normal;color:#7dd3fc}
.hero p.lead{margin-top:20px;color:#cbd5e1;font-size:16px;line-height:1.7;max-width:42rem}
@media(min-width:640px){.hero p.lead{font-size:18px}}
.hero .z{position:relative;z-index:1;max-width:48rem}
.stats3{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:32rem}
.stats3 .n{font-family:var(--font-serif);font-size:30px;font-weight:700;color:#fcd34d}
.stats3 .l{font-size:12px;color:#94a3b8;margin-top:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .5s ease-out both}
h2.sec{font-family:var(--font-serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
@media(min-width:640px){h2.sec{font-size:30px}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr;gap:20px}
@media(min-width:768px){.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.g3{grid-template-columns:repeat(3,1fr)}}
.card{border:1px solid var(--border);background:var(--card);color:var(--card-foreground);border-radius:16px}
.paper{border:1px solid var(--border);background:var(--background-paper);border-radius:16px}
.obj{display:flex;gap:16px;padding:20px}
.obj .ic{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:12px;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
.obj p{font-size:14px;line-height:1.7}
.pill{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--border);transition:.15s}
.pill:hover{background:var(--secondary)}
.pill.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.pill.ax{padding:4px 12px;font-size:12px;font-weight:600;color:var(--muted-foreground)}
.pill.ax.on{background:var(--ochre);color:#fff;border-color:var(--ochre)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.course{display:flex;flex-direction:column;padding:24px;transition:all .3s;position:relative}
.course:hover{box-shadow:0 20px 25px -5px rgba(0,0,0,.12),0 8px 10px -6px rgba(0,0,0,.1);transform:translateY(-4px);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
.course h3{margin-top:12px;font-family:var(--font-serif);font-size:20px;font-weight:600;line-height:1.3;transition:color .2s}
.course:hover h3{color:var(--primary)}
.course .d{margin-top:8px;font-size:14px;color:var(--muted-foreground);line-height:1.65;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.course .ft{margin-top:16px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted-foreground);border-top:1px solid var(--border);padding-top:12px}
.course .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid;display:inline-block}
.badge.l{font-size:12px;padding:4px 10px}
.ax-0{background:rgba(14,165,233,.1);color:#0369a1;border-color:#7dd3fc}
.ax-1{background:rgba(245,158,11,.1);color:#92400e;border-color:#fcd34d}
.ax-2{background:rgba(16,185,129,.1);color:#065f46;border-color:#6ee7b7}
.ax-3{background:rgba(99,102,241,.1);color:#3730a3;border-color:#a5b4fc}
.ax-4{background:rgba(244,63,94,.1);color:#9f1239;border-color:#fda4af}
.ax-5{background:rgba(139,92,246,.1);color:#5b21b6;border-color:#c4b5fd}
.ax-x{background:rgba(100,116,139,.1);color:#334155;border-color:#cbd5e1}
.dark .ax-0{color:#7dd3fc;border-color:#075985}.dark .ax-1{color:#fcd34d;border-color:#92400e}
.dark .ax-2{color:#6ee7b7;border-color:#065f46}.dark .ax-3{color:#a5b4fc;border-color:#3730a3}
.dark .ax-4{color:#fda4af;border-color:#9f1239}.dark .ax-5{color:#c4b5fd;border-color:#5b21b6}
.dark .ax-x{color:#cbd5e1;border-color:#334155}
.empty{margin-top:32px;border:1px dashed var(--border);background:var(--background-paper);border-radius:16px;padding:40px;text-align:center;color:var(--muted-foreground)}
.empty p{margin-top:12px}
.muted{color:var(--muted-foreground)}
.xs{font-size:12px}.sm{font-size:14px}
/* login */
.loginwrap{min-height:calc(100vh - 64px);display:grid}
@media(min-width:1024px){.loginwrap{grid-template-columns:1fr 1fr}}
.sidebrand{display:none;flex-direction:column;justify-content:space-between;padding:48px;background:linear-gradient(135deg,#082f49,#0f172a 50%,#451a03);color:#fff;position:relative;overflow:hidden}
@media(min-width:1024px){.sidebrand{display:flex}}
.sidebrand h1{font-family:var(--font-serif);font-size:48px;font-weight:700;line-height:1.15}
.sidebrand p{margin-top:16px;color:#cbd5e1;line-height:1.7}
.formside{display:flex;align-items:center;justify-content:center;padding:24px}
@media(min-width:640px){.formside{padding:48px}}
.form{width:100%;max-width:384px;display:flex;flex-direction:column;gap:24px}
.form h2{font-family:var(--font-serif);font-size:30px;font-weight:700}
.field{display:grid;gap:8px}
.err{font-size:14px;color:var(--destructive);background:color-mix(in srgb,var(--destructive) 10%,transparent);border:1px solid color-mix(in srgb,var(--destructive) 30%,transparent);border-radius:8px;padding:8px 12px}
/* dashboard */
.banner{border:1px solid var(--border);border-radius:16px;background:linear-gradient(135deg,#082f49,#0f172a 50%,#451a03);color:#fff;padding:24px}
@media(min-width:640px){.banner{padding:32px}}
.banner h1{margin-top:8px;font-family:var(--font-serif);font-size:30px;font-weight:700}
@media(min-width:640px){.banner h1{font-size:36px}}
.banner p{margin-top:8px;color:#cbd5e1;font-size:14px}
.banner a.go{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);padding:8px 16px;border-radius:8px;transition:.15s}
.banner a.go:hover{background:rgba(255,255,255,.2)}
h2.h2i{margin-top:40px;font-family:var(--font-serif);font-size:24px;font-weight:600;display:flex;align-items:center;gap:8px}
h2.h2i svg{color:var(--primary)}
/* course detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted-foreground);transition:.15s}
.back:hover{color:var(--foreground)}
.chead{margin-top:16px;padding:24px}
@media(min-width:640px){.chead{padding:32px}}
.chead .top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.chead h1{margin-top:16px;font-family:var(--font-serif);font-size:30px;font-weight:700;letter-spacing:-.01em}
@media(min-width:640px){.chead h1{font-size:36px}}
.chead .desc{margin-top:12px;color:var(--muted-foreground);line-height:1.7;max-width:48rem}
.meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:14px}
.meta span{display:flex;align-items:center;gap:6px}.meta svg{color:var(--primary)}
.progress{height:8px;border-radius:999px;background:color-mix(in srgb,var(--primary) 20%,transparent);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s}
.objbox{margin-top:24px;padding:24px}
.objbox h2{font-family:var(--font-serif);font-size:20px;font-weight:600}
.objbox ul{margin-top:12px;display:grid;gap:8px}
@media(min-width:640px){.objbox ul{grid-template-columns:1fr 1fr}}
.objbox li{display:flex;gap:8px;font-size:14px}.objbox li svg{color:var(--sage);margin-top:2px}
.tabs{margin-top:32px}
.tablist{display:inline-flex;height:36px;align-items:center;border-radius:10px;background:var(--muted);padding:4px;color:var(--muted-foreground)}
.tabs .tabbtn{padding:4px 12px;border-radius:8px;font-size:14px;font-weight:500;height:28px;transition:.15s}
.tabs .tabbtn.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pane{margin-top:16px}.pane[hidden]{display:none}
.acc{display:grid;gap:8px}
.acc-item{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:0 16px}
.acc-head{display:flex;align-items:center;gap:12px}
.acc-head input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);flex-shrink:0}
.acc-trig{flex:1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;text-align:left;font-weight:500}
.acc-trig .l{display:flex;align-items:center;gap:12px}
.acc-trig .num{font-family:var(--font-mono);font-size:12px;color:var(--ochre);font-weight:600}
.acc-trig svg{color:var(--muted-foreground);transition:transform .2s}
.acc-item.open .acc-trig svg{transform:rotate(180deg)}
.acc-body{display:none;padding-bottom:16px}.acc-item.open .acc-body{display:block}
.acc-body p{font-size:14px;color:var(--muted-foreground);line-height:1.7}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:8px;background:var(--secondary);color:var(--secondary-foreground)}
.chip.vid{background:rgba(244,63,94,.1);color:#be123c}.dark .chip.vid{color:#fda4af}
.stack{display:grid;gap:12px}.stack6{display:grid;gap:24px}.stack4{display:grid;gap:16px}
.box{padding:16px;border:1px solid var(--border);background:var(--card);border-radius:12px}
.box20{padding:20px}
.sp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grade{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--sage) 15%,transparent);color:var(--sage)}
.retour{margin-top:8px;font-size:12px;font-style:italic;color:var(--ochre)}
.role-tag{font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--secondary);color:var(--muted-foreground)}
.avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
.sec-title{font-size:14px;font-weight:600;color:var(--muted-foreground)}
/* admin */
.ad-head{display:flex;align-items:center;gap:8px;color:var(--ochre)}
.admin h1{margin-top:8px;font-family:var(--font-serif);font-size:30px;font-weight:700}
@media(min-width:640px){.admin h1{font-size:36px}}
.stat4{margin-top:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:640px){.stat4{grid-template-columns:repeat(4,1fr)}}
.stat{padding:20px}.stat svg{color:var(--primary)}
.stat .v{margin-top:12px;font-family:var(--font-serif);font-size:30px;font-weight:700}
.stat .k{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.toolbar{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.tw{position:relative;width:256px;max-width:100%}
.tw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
.tablebox{margin-top:20px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
thead{background:var(--background-paper);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground)}
th,td{padding:12px 16px}th.r{text-align:right}
tbody tr{border-top:1px solid var(--border)}tbody tr:hover{background:color-mix(in srgb,var(--secondary) 40%,transparent)}
.hide-md{display:none}@media(min-width:640px){.hide-sm-cell{display:table-cell!important}}@media(min-width:768px){.hide-md{display:table-cell}}
.hide-sm-cell{display:none}
.rolebadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.rb-admin{background:color-mix(in srgb,var(--ochre) 15%,transparent);color:var(--ochre)}
.rb-ens{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.rb-etu{background:color-mix(in srgb,var(--sage) 15%,transparent);color:var(--sage)}
.acts{display:flex;justify-content:flex-end;gap:4px}
/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--background);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);width:100%;max-width:512px;max-height:90vh;overflow-y:auto;padding:24px;position:relative}
.modal h3{font-family:var(--font-serif);font-size:24px;font-weight:600;margin-bottom:16px}
.modal .x{position:absolute;right:16px;top:16px;opacity:.6;font-size:20px;line-height:1}
.modal .x:hover{opacity:1}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.assign{max-height:224px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px;display:grid;gap:8px}
.assign .yr{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);padding:4px}
.assign label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:14px}
.assign label:hover{background:var(--secondary)}
.assign label span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assign input{accent-color:var(--primary)}
/* toasts */
#toasts{position:fixed;top:16px;right:16px;z-index:100;display:grid;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;padding:12px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:fadeUp .25s both}
.toast.ok{border-left-color:var(--sage)}.toast.ko{border-left-color:var(--destructive)}
.center{min-height:60vh;display:grid;place-items:center;color:var(--muted-foreground)}
.pb{padding-bottom:80px}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt6{margin-top:24px}.mt8{margin-top:32px}.mt10{margin-top:40px}.mt16{margin-top:64px}
.pt8{padding-top:32px}.py10{padding-top:40px;padding-bottom:40px}.py8{padding-top:32px;padding-bottom:32px}
.sticky-anchor{scroll-margin-top:80px}
.ta-c{text-align:center}
.footnote{font-size:12px;text-align:center;color:var(--muted-foreground)}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ===== contenu de séance ===== */
.bar-demo{background:color-mix(in srgb,var(--ochre) 14%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ochre) 40%,transparent);color:var(--foreground);font-size:12px;text-align:center;padding:6px 12px}
.card.locked{opacity:.72}
.lockhint{font-size:11px;color:var(--ochre);font-weight:600}
.blocks{margin-top:16px;display:grid;gap:12px}
.blk{position:relative;border:1px solid var(--border);border-radius:12px;background:var(--background-paper);padding:14px 16px}
.blk .bt{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding-right:72px}
.blk .bt svg{color:var(--primary)}
.blk .bb{margin-top:6px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.blk .bctl{position:absolute;right:6px;top:6px;display:flex}
.blk .bctl .btn{height:28px;width:28px}
.blk a.lnk{color:var(--primary);text-decoration:underline;word-break:break-all;font-size:13px}
.blk.devoir{border-left:4px solid var(--ochre);background:color-mix(in srgb,var(--ochre) 7%,var(--card))}
.blk.devoir .bt svg{color:var(--ochre)}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--secondary);color:var(--muted-foreground)}
.tag.pdf{background:rgba(225,29,72,.12);color:#be123c}.tag.word{background:rgba(2,132,199,.12);color:#0369a1}.tag.ppt{background:rgba(217,119,6,.14);color:#b45309}.tag.xls{background:rgba(5,150,105,.14);color:#047857}
.blk img.pic{max-width:100%;max-height:520px;border-radius:10px;margin-top:8px;display:block}
.blk iframe{width:100%;border:0;border-radius:10px;margin-top:10px;background:#fff}
.blk .vid{aspect-ratio:16/9;height:auto}
.blk .formframe{height:720px}
.addrow{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}
.hint{font-size:12px;color:var(--muted-foreground)}
.tabs2{display:inline-flex;background:var(--muted);padding:4px;border-radius:10px;gap:2px}
.tabs2 button{padding:4px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted-foreground)}
.tabs2 button.on{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.ok-msg{font-size:14px;color:var(--sage);background:color-mix(in srgb,var(--sage) 10%,transparent);border:1px solid color-mix(in srgb,var(--sage) 30%,transparent);border-radius:8px;padding:8px 12px}
.pending{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;color:var(--ochre)}
.modal.wide{max-width:600px}

.blk.live{border-left:4px solid var(--primary)}
.tag.now{background:color-mix(in srgb,var(--sage) 18%,transparent);color:var(--sage)}
.tag.soon{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.tag.past{background:var(--secondary);color:var(--muted-foreground)}
.colorf{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.colorf input[type=color]{width:40px;height:32px;border:0;padding:0;background:none;cursor:pointer}
.fg2,.fg3{grid-template-columns:1fr}
@media(min-width:768px){.fg2{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:repeat(3,1fr)}}
</style>

var mem=null;
function loadDB(){
  var raw=null;try{raw=localStorage.getItem(DB_KEY)}catch(e){}
  var db=null;try{db=raw?JSON.parse(raw):null}catch(e){db=null}
  if(!db&&mem)db=mem;
  if(!db)db={users:[],edits:{},progress:{},forum:[],subs:[],blocks:[],settings:null,custom:{}};
  db.blocks=db.blocks||[];db.custom=db.custom||{};
  if(!db.users.some(function(u){return u.email===ADMIN_SEED.email.toLowerCase()})){
    db.users.unshift({id:uid(),email:ADMIN_SEED.email.toLowerCase(),name:ADMIN_SEED.name,role:'admin',course_codes:[],pw:hashPw(ADMIN_SEED.password),created_at:new Date().toISOString()});
    saveDB(db);
  }
  return db}
function saveDB(db){mem=db;try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){if(e&&/quota/i.test(e.name+e.message))throw new Error('Espace de stockage du navigateur plein (mode démonstration). Utilisez un fichier plus léger ou passez à Supabase.')}}
function pub(u){return {id:u.id,email:u.email,name:u.name||'',role:u.role||'etudiant',course_codes:u.course_codes||[]}}
function pk(uidv,code){return uidv+'|'+code}

var Local=(function(){

  function cur(){var id=getSes();return D().users.find(function(x){return x.id===id})}
  return {
    mode:'local',
    init:async function(){var u=cur();return u?pub(u):null},

      if(!u||u.pw!==hashPw(pw))throw new Error('Email ou mot de passe incorrect');setSes(u.id);return pub(u)},
    signup:async function(){throw new Error("L'inscription n'est pas disponible en mode démonstration.")},

      if(!o.password)throw new Error('Un mot de passe est requis.');
      D().users.push({id:uid(),email:email,name:o.name,role:o.role,course_codes:o.course_codes,pw:hashPw(o.password),created_at:new Date().toISOString()});saveDB(D())},
    deleteInvite:async function(){},

    customCourses:async function(){return clone(D().custom||{})},
    saveCustomCourse:async function(code,data){D().custom=D().custom||{};D().custom[code]=data;saveDB(D())},
    deleteCustomCourse:async function(code){delete D().custom[code];delete D().edits[code];D().blocks=D().blocks.filter(function(b){return b.course_code!==code});saveDB(D())},
    upcomingLive:async function(codes){var now=Date.now();return sortBlocks(D().blocks.filter(function(b){return b.kind==='live'&&b.starts_at&&(!codes||codes.indexOf(b.course_code)>=0)&&(new Date(b.starts_at).getTime()+(b.duration_min||60)*60000>=now)}))
      .sort(function(a,b){return new Date(a.starts_at)-new Date(b.starts_at)}).slice(0,8).map(function(b){var c=Object.assign({},b);delete c.file_data;return c})},
    blocks:async function(code){return sortBlocks(D().blocks.filter(function(b){return b.course_code===code})).map(function(b){var c=Object.assign({},b);delete c.file_data;return c})},
    saveBlock:async function(b,file){
      var row={course_code:b.course_code,seance_num:b.seance_num,kind:b.kind,title:b.title,body:b.body,url:b.url,due:b.due,position:b.position,starts_at:b.starts_at||null,duration_min:b.duration_min||null,replay_url:b.replay_url||''};
      var ex=b.id?D().blocks.find(function(x){return x.id===b.id}):null;

    deleteBlock:async function(b){D().blocks=D().blocks.filter(function(x){return x.id!==b.id});saveDB(D())},
    fileUrls:async function(blocks){var m={};blocks.forEach(function(b){if(b.file_path){var x=D().blocks.find(function(y){return y.id===b.id});if(x&&x.file_data)m[b.id]=x.file_data}});return m},
    progress:async function(code){var u=cur();return (D().progress[pk(u.id,code)]||[]).slice()},
    setProgress:async function(code,num,done){var u=cur();var k=pk(u.id,code);var s=(D().progress[k]||[]).slice();var i=s.indexOf(num);
      if(done&&i<0)s.push(num);if(!done&&i>=0)s.splice(i,1);s.sort();D().progress[k]=s;saveDB(D())},
    forum:async function(code){return D().forum.filter(function(p){return p.code===code}).sort(function(a,b){return a.created_at<b.created_at?1:-1})},

      return D().subs.filter(function(s){return s.code===code&&(ed||s.user_id===u.id)}).sort(function(a,b){return a.created_at<b.created_at?1:-1})},
    addSub:async function(code,text){var u=cur();D().subs.push({id:uid(),code:code,user_id:u.id,student_name:u.name,text:text,grade:null,feedback:'',created_at:new Date().toISOString()});saveDB(D())},
    grade:async function(id,grade,fb){var s=D().subs.find(function(x){return x.id===id});if(!s)throw new Error('Soumission introuvable');s.grade=grade;s.feedback=fb;saveDB(D())}
  }})();

/* ================= Couche données : Supabase (mode en ligne) ================= */
var Cloud=(function(){
  var sb=null;function C(){if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return sb}
  async function q(p){var r=await p;if(r.error)throw new Error(r.error.message||'Erreur serveur');return r.data}
  async function profileOf(authUser){if(!authUser)return null;
    var d=await q(C().from('profiles').select('*').eq('id',authUser.id).maybeSingle());return d?pub(d):null}
  async function rpc(fn,args){var r=await C().rpc(fn,args);if(r.error){var m=r.error.message||'Erreur serveur';if(/could not find the function|schema cache/i.test(m))m="Fonction manquante dans Supabase : exécutez le fichier supabase_users.sql (SQL Editor).";throw new Error(m)}return r.data}
  async function uidNow(){var r=await C().auth.getUser();return r.data&&r.data.user?r.data.user.id:null}
  return {
    mode:'cloud',
    init:async function(){var r=await C().auth.getSession();if(!r.data||!r.data.session)return null;return profileOf(r.data.session.user)},
    login:async function(email,pw){var r=await C().auth.signInWithPassword({email:email,password:pw});
      if(r.error){if(/confirm/i.test(r.error.message))throw new Error("Veuillez d'abord confirmer votre adresse email (lien envoyé par courriel).");throw new Error('Supabase a répondu : « '+r.error.message+' » — projet : '+String(SUPABASE_URL).replace(/^https?:\/\//,''))}
      var p=await profileOf(r.data.user);if(!p){await C().auth.signOut();throw new Error("Ce compte n'a pas de profil actif. Contactez l'administrateur.")}return p},
    signup:async function(name,email,pw){var r=await C().auth.signUp({email:email,password:pw,options:{data:{name:name}}});
      if(r.error)throw new Error(r.error.message);
      if(!r.data.session)return {needsConfirm:true};
      return {user:await profileOf(r.data.user)}},
    logout:async function(){await C().auth.signOut()},
    profiles:async function(){return (await q(C().from('profiles').select('*').order('created_at',{ascending:true}))).map(pub)},
    invites:async function(){return await q(C().from('invitations').select('*').order('created_at',{ascending:true}))},
    saveProfile:async function(id,p){var u={};if(p.name!=null)u.name=p.name;if(p.role)u.role=p.role;if(p.course_codes)u.course_codes=p.course_codes;await q(C().from('profiles').update(u).eq('id',id));
      if(p.password)await rpc('admin_set_password',{p_id:id,p_password:p.password})},
    deleteProfile:async function(id){await rpc('admin_delete_user',{p_id:id})},
    invite:async function(o){var email=o.email.toLowerCase();
      if(!o.password||o.password.length<8)throw new Error('Mot de passe requis : 8 caractères minimum.');
      await rpc('admin_create_user',{p_email:email,p_name:o.name,p_password:o.password,p_role:o.role,p_codes:o.course_codes||[]})},
    deleteInvite:async function(email){await q(C().from('invitations').delete().eq('email',email))},
    edits:async function(){var rows=await q(C().from('course_edits').select('*'));var m={};rows.forEach(function(r){m[r.code]=r.data});return m},
    saveEdit:async function(code,data){await q(C().from('course_edits').upsert({code:code,data:data,updated_at:new Date().toISOString()},{onConflict:'code'}))},
    settings:async function(){var d=await q(C().from('site_settings').select('data').eq('id',1).maybeSingle());return d?d.data:null},
    saveSettings:async function(v){await q(C().from('site_settings').upsert({id:1,data:v,updated_at:new Date().toISOString()},{onConflict:'id'}))},
    customCourses:async function(){var rows=await q(C().from('custom_courses').select('*'));var m={};rows.forEach(function(r){m[r.code]=r.data});return m},
    saveCustomCourse:async function(code,data){await q(C().from('custom_courses').upsert({code:code,data:data},{onConflict:'code'}))},
    deleteCustomCourse:async function(code){
      var bl=await q(C().from('blocks').select('file_path').eq('course_code',code));
      var paths=bl.map(function(b){return b.file_path}).filter(Boolean);if(paths.length)await C().storage.from(BUCKET).remove(paths);
      await q(C().from('blocks').delete().eq('course_code',code));await q(C().from('course_edits').delete().eq('code',code));await q(C().from('custom_courses').delete().eq('code',code))},
    upcomingLive:async function(codes){var since=new Date(Date.now()-6*3600000).toISOString();
      var rows=await q(C().from('blocks').select('*').eq('kind','live').gte('starts_at',since).order('starts_at',{ascending:true}));var now=Date.now();
      return rows.filter(function(b){return (!codes||codes.indexOf(b.course_code)>=0)&&(new Date(b.starts_at).getTime()+(b.duration_min||60)*60000>=now)}).slice(0,8)},
    blocks:async function(code){return sortBlocks(await q(C().from('blocks').select('*').eq('course_code',code)))},
    saveBlock:async function(b,file){
      var row={course_code:b.course_code,seance_num:b.seance_num,kind:b.kind,title:b.title,body:b.body,url:b.url,due:b.due,position:b.position,starts_at:b.starts_at||null,duration_min:b.duration_min||null,replay_url:b.replay_url||''};
      var oldPath=b.file_path||null;
      if(file){var path=b.course_code+'/'+uid()+'-'+safeName(file.name);
        var up=await C().storage.from(BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
        if(up.error)throw new Error("Échec de l'envoi du fichier : "+up.error.message);
        row.file_path=path;row.file_name=file.name}
      if(b.id)await q(C().from('blocks').update(row).eq('id',b.id));else await q(C().from('blocks').insert(row));
      if(file&&oldPath&&b.id)await C().storage.from(BUCKET).remove([oldPath])},
    deleteBlock:async function(b){await q(C().from('blocks').delete().eq('id',b.id));if(b.file_path)await C().storage.from(BUCKET).remove([b.file_path])},
    fileUrls:async function(blocks){var m={};var withF=blocks.filter(function(b){return b.file_path});if(!withF.length)return m;
      var r=await C().storage.from(BUCKET).createSignedUrls(withF.map(function(b){return b.file_path}),3600);
      if(r.error||!r.data)return m;
      r.data.forEach(function(x){if(x.signedUrl){withF.forEach(function(b){if(b.file_path===x.path)m[b.id]=x.signedUrl})}});return m},
    progress:async function(code){return (await q(C().from('progress').select('seance_num').eq('course_code',code))).map(function(r){return r.seance_num}).sort()},
    setProgress:async function(code,num,done){var u=await uidNow();
      if(done)await q(C().from('progress').upsert({user_id:u,course_code:code,seance_num:num},{onConflict:'user_id,course_code,seance_num'}));
      else await q(C().from('progress').delete().eq('user_id',u).eq('course_code',code).eq('seance_num',num))},
    forum:async function(code){return await q(C().from('forum_posts').select('*').eq('course_code',code).order('created_at',{ascending:false}))},
    addForum:async function(code,text){var me=state.user;await q(C().from('forum_posts').insert({course_code:code,author_name:me.name,role:me.role,text:text}))},
    subs:async function(code){return await q(C().from('submissions').select('*').eq('course_code',code).order('created_at',{ascending:false}))},
    addSub:async function(code,text){var me=state.user;await q(C().from('submissions').insert({course_code:code,student_name:me.name,text:text}))},
    grade:async function(id,grade,fb){await q(C().from('submissions').update({grade:grade,feedback:fb}).eq('id',id))}
  }})();

function route(){var h=(location.hash||'#/').replace(/^#/,'')||'/';var p=h.split('?')[0];
  if(p==='/'||p==='')return{name:'home'};
  if(p==='/login')return{name:'login'};
  if(p==='/tableau-de-bord')return{name:'dash'};
  if(p==='/admin')return{name:'admin'};
  var m=p.match(/^\/cours\/(.+)$/);if(m)return{name:'course',code:decodeURIComponent(m[1])};
  return{name:'redirect',to:'#/'}}
function go(h){if(location.hash===h)render();else location.hash=h}

/* ================= Vues ================= */
function navbar(user){
  var cs=getSettings();var theme=document.documentElement.classList.contains('dark')?'dark':'light';
  var h=(S.mode==='local'?'<div class="bar-demo">Mode démonstration : les données restent dans ce navigateur. Configurez Supabase (voir le guide) pour une plateforme partagée en ligne.</div>':'')+
   '<header class="top"><div class="wrap in">'+
   '<a href="#/" class="brand"><span class="logo">'+ic('grad','s5')+'</span><span><span class="t1">'+esc(cs.brand_name)+'</span><span class="t2">'+esc(cs.brand_tag)+'</span></span></a>'+
   '<div class="actions"><button class="iconbtn" data-act="theme" aria-label="Basculer le thème">'+(theme==='dark'?ic('sun'):ic('moon'))+'</button>';
  if(user){
    if(user.role==='admin')h+='<a class="btn outline sm hide-sm-flex" href="#/admin">'+ic('shield')+' Admin</a>';
    h+='<a class="btn outline sm" href="#/tableau-de-bord">'+ic('dash')+' <span class="hide-sm">Mon espace</span></a>'+
      '<div class="whoami"><b>'+esc(user.name||user.email)+'</b><span>'+ROLE_LABELS[user.role]+'</span></div>'+
      '<button class="iconbtn danger" data-act="logout" aria-label="Déconnexion">'+ic('logout')+'</button>';
  }else h+='<a class="btn sm" href="#/login">Connexion</a>';
  return h+'</div></div></header>'}

function courseCard(c,full,user){
  var locked=user&&!enrolled(user,c.code);
  return '<a class="card course'+(locked?' locked':'')+'" href="#/cours/'+encodeURIComponent(c.code)+'">'+
   '<div class="hd"><span class="badge '+axisClass(c.axis)+'">'+esc(c.axis)+'</span><span class="mono xs muted">'+esc(c.code)+'</span></div>'+
   '<h3>'+esc(c.title)+'</h3>'+
   (full?'<p class="d">'+esc(c.desc)+'</p><div class="ft"><span>'+esc(c.year)+'</span>'+(locked?'<span class="lockhint">Accès sur inscription</span>':'<span style="font-weight:500">'+esc(c.credits)+'</span>')+'</div>'
        :'<p class="xs muted mt2" style="margin-top:4px">'+esc(c.year)+' · '+esc(c.credits)+'</p>')+'</a>'}

function filteredCourses(){
  return allCourses().filter(function(c){
    if(ui.year!=='Toutes'&&c.year!==ui.year)return false;
    if(ui.axis!=='Tous les axes'&&c.axis!==ui.axis)return false;
    if(ui.q&&(c.title+' '+c.code+' '+(c.prof||'')).toLowerCase().indexOf(ui.q.toLowerCase())<0)return false;
    return true})}
function gridHTML(){var f=filteredCourses();
  return '<div class="grid g3 mt8">'+f.map(function(c){return courseCard(c,true,state.user)}).join('')+'</div>'+
   (f.length?'':'<p class="mt10 ta-c muted">Aucun cours ne correspond à votre recherche.</p>')}

/* ----- blocs de contenu d'une séance ----- */
function blockHTML(b,url,edit){
  var ctl=edit?'<div class="bctl"><button class="btn ghost icon" data-act="blk-edit" data-id="'+esc(b.id)+'" aria-label="Modifier">'+ic('pencil')+'</button><button class="btn ghost icon" style="color:var(--destructive)" data-act="blk-del" data-id="'+esc(b.id)+'" aria-label="Supprimer">'+ic('trash')+'</button></div>':'';
  var h='',u=safeUrl(b.url);
  switch(b.kind){
   case 'texte':
    h='<div class="blk">'+ctl+(b.title?'<div class="bt">'+ic('text')+esc(b.title)+'</div>':'')+'<div class="bb">'+esc(b.body)+'</div></div>';break;
   case 'lien':
    h='<div class="blk">'+ctl+'<div class="bt">'+ic('link')+esc(b.title||b.url)+'</div>'+(b.body?'<div class="bb">'+esc(b.body)+'</div>':'')+(u?'<div style="margin-top:6px"><a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(u)+'</a></div>':'')+'</div>';break;
   case 'fichier':
    var t=fileTag(b.file_name);
    h='<div class="blk">'+ctl+'<div class="bt">'+ic('file')+esc(b.title||b.file_name||'Document')+' <span class="tag '+t[1]+'">'+esc(t[0])+'</span></div>'+(b.body?'<div class="bb">'+esc(b.body)+'</div>':'')+
      (url?'<div style="margin-top:8px"><a class="btn outline sm" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" download="'+esc(b.file_name||'document')+'">'+ic('ext')+' Ouvrir / télécharger'+(b.file_name?' — '+esc(b.file_name):'')+'</a></div>':'<p class="hint" style="margin-top:6px">Fichier indisponible.</p>')+'</div>';break;
   case 'image':
    h='<div class="blk">'+ctl+(b.title?'<div class="bt">'+ic('image')+esc(b.title)+'</div>':'')+(url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><img class="pic" loading="lazy" src="'+esc(url)+'" alt="'+esc(b.title||b.file_name||'Image')+'"></a>':'<p class="hint">Image indisponible.</p>')+'</div>';break;
   case 'video':
    var em=ytEmbed(b.url);
    h='<div class="blk">'+ctl+'<div class="bt">'+ic('play')+esc(b.title||'Vidéo')+'</div>'+(em?'<iframe class="vid" src="'+esc(em)+'" title="'+esc(b.title||'Vidéo')+'" allowfullscreen loading="lazy"></iframe>':(u?'<div style="margin-top:6px"><a class="lnk" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(u)+'</a></div>':''))+'</div>';break;
   case 'live':
    var ls=liveState(b);var lab={soon:'À venir',now:'Salle ouverte',past:'Terminé',none:'Non planifié'}[ls];var rp=safeUrl(b.replay_url);
    h='<div class="blk live">'+ctl+'<div class="bt">'+ic('video')+esc(b.title||'Cours en direct')+' <span class="tag">Séance '+esc(b.seance_num)+'</span> <span class="tag '+ls+'">'+lab+'</span></div>'+
      (b.starts_at?'<div class="hint" style="margin-top:4px">'+ic('cal','s35')+' '+esc(fmtDate(b.starts_at))+' · '+(b.duration_min||60)+' min</div>':'')+
      (b.body?'<div class="bb">'+esc(b.body)+'</div>':'')+
      '<div class="row" style="margin-top:10px">'+
      (ls!=='past'&&u?'<a class="btn'+(ls==='now'?'':' outline')+' sm" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+ic('ext')+' Rejoindre</a>':'')+
      (ls!=='past'&&u&&isJitsi(u)?'<button class="btn outline sm" data-act="form-toggle" data-live="1" data-label="Rejoindre dans la page" data-src="'+esc(u)+'">Rejoindre dans la page</button>':'')+
      (rp?'<a class="btn outline sm" href="'+esc(rp)+'" target="_blank" rel="noopener noreferrer">'+ic('play')+" Revoir l'enregistrement</a>":'')+
      (b.starts_at&&ls!=='past'?icsLink(b):'')+'</div><div class="formbox"></div></div>';break;
   case 'devoir':
    h='<div class="blk devoir">'+ctl+'<div class="bt">'+ic('form')+esc(b.title||'Devoir')+' <span class="tag">Devoir</span></div>'+(b.due?'<div class="hint" style="margin-top:4px">Échéance : '+esc(b.due)+'</div>':'')+(b.body?'<div class="bb">'+esc(b.body)+'</div>':'')+
      (u?'<div class="row" style="margin-top:10px"><a class="btn sm" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+ic('ext')+' Ouvrir le formulaire</a><button class="btn outline sm" data-act="form-toggle" data-src="'+esc(formEmbed(u))+'">Afficher dans la page</button></div><div class="formbox"></div>':'')+'</div>';break;
  }
  return h}

function seanceBody(s,code,ctx,user){
  var edit=canEdit(user,code);var bl=(ctx.blocks||[]).filter(function(b){return b.seance_num===s.num});
  var h='<p>'+esc(s.desc)+'</p><div class="chips">'+(s.lectures||[]).map(function(l){return '<span class="chip">'+ic('file','s35')+' '+esc(l.label)+'</span>'}).join('')+(s.youtube?'<span class="chip vid">'+ic('play','s35')+' Vidéo</span>':'')+'</div>';
  if(bl.length)h+='<div class="blocks">'+bl.map(function(b){return blockHTML(b,(ctx.urls||{})[b.id],edit)}).join('')+'</div>';
  if(edit)h+='<div class="addrow"><button class="btn outline sm" data-act="blk-new" data-num="'+esc(s.num)+'">'+ic('plus')+' Ajouter du contenu</button></div>';
  return h}

function viewCourse(user,code,ctx){
  var base=getCourse(code);
  if(!base)return '<div class="center">Cours introuvable</div>';
  var edit=canEdit(user,code);var isStu=user.role==='etudiant';
  var course=ui.editing&&ui.draft?ui.draft:base;
  var completed=ctx.completed||[];
  var seances=(ui.editing?ui.draft.seances:base.seances)||[];var total=(base.seances||[]).length;
  var pct=total?Math.round(completed.length/total*100):0;
  var h='<div class="wrap6 py8"><a class="back" href="#/">'+ic('left')+' Retour au catalogue</a><div class="card chead"><div class="top"><div class="row" style="align-items:center;gap:8px">'+
   '<span class="badge l '+axisClass(base.axis)+'">'+esc(base.axis)+'</span><span class="mono xs muted">'+esc(base.code)+'</span><span class="xs muted">· '+esc(base.year)+'</span>'+modeBadge(base.mode)+'</div>';
  if(edit&&!ui.editing)h+='<button class="btn outline sm" data-act="edit-start">'+ic('pencil')+' Modifier la structure</button>';
  if(ui.editing)h+='<div class="row"><button class="btn ghost sm" data-act="edit-cancel">Annuler</button><button class="btn sm" data-act="edit-save">'+ic('save')+' Enregistrer</button></div>';
  h+='</div>';
  if(ui.editing){
    h+='<div class="stack mt4"><input class="input serif" style="font-size:20px;height:40px" data-bind="title" value="'+esc(course.title)+'">'+
     '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px"><input class="input" data-bind="prof" placeholder="Enseignant" value="'+esc(course.prof)+'"><input class="input" data-bind="credits" placeholder="Crédits" value="'+esc(course.credits)+'"><input class="input" data-bind="schedule" placeholder="Horaire" value="'+esc(course.schedule)+'"></div>'+
     '<textarea class="textarea" rows="3" data-bind="desc">'+esc(course.desc)+'</textarea>'+editExtra(course)+'</div>';
  }else{
    h+='<h1>'+esc(base.title)+'</h1><p class="desc">'+esc(base.desc)+'</p><div class="meta"><span>'+ic('grad')+' '+esc(base.prof)+'</span><span>'+ic('clock')+' '+esc(base.schedule)+'</span><span class="muted">'+esc(base.credits)+'</span>'+(base.prereq?'<span class="muted">Préalable : '+esc(base.prereq)+'</span>':'')+'</div>'+roomHTML(base);
  }
  if(isStu&&!ui.editing&&total>0)h+='<div class="mt6"><div class="sp sm" style="margin-bottom:6px"><span style="font-weight:500">Ma progression</span><span class="muted" id="prog-label">'+pct+'% · '+completed.length+'/'+total+' séances</span></div><div class="progress"><i style="width:'+pct+'%"></i></div></div>';
  h+='</div>';
  if((base.objectifs||[]).length&&!ui.editing)h+='<div class="paper objbox"><h2>Objectifs d\'apprentissage</h2><ul>'+base.objectifs.map(function(o){return '<li>'+ic('check')+' <span>'+esc(o)+'</span></li>'}).join('')+'</ul></div>';
  h+='<div class="tabs"><div class="tablist">'+[['seances','Séances'],['live','En direct'],['devoir','Devoir'],['forum','Forum']].map(function(t){return '<button class="tabbtn'+(ui.tab===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
  // Séances
  h+='<div class="pane" data-pane="seances"'+(ui.tab==='seances'?'':' hidden')+'>';
  if(ui.editing){
    h+='<p class="hint" style="margin-bottom:10px">Mode structure : renommez, ajoutez ou supprimez des séances. Le contenu (documents, liens, devoirs…) s\'ajoute séance par séance une fois l\'enregistrement fait.</p><div class="stack">'+seances.map(function(s,i){return '<div class="box stack" style="gap:8px"><div class="row" style="flex-wrap:nowrap;align-items:center"><span class="mono xs" style="color:var(--ochre);font-weight:600">'+esc(s.num)+'</span><input class="input" style="flex:1" data-seance="titre" data-i="'+i+'" value="'+esc(s.titre)+'"><button class="btn ghost icon" data-act="seance-del" data-i="'+i+'" style="color:var(--destructive)">'+ic('trash')+'</button></div><textarea class="textarea" rows="2" data-seance="desc" data-i="'+i+'" placeholder="Description de la séance">'+esc(s.desc)+'</textarea></div>'}).join('')+
     '<div><button class="btn outline" data-act="seance-add">'+ic('plus')+' Ajouter une séance</button></div></div>';
  }else{
    h+='<div class="acc">'+seances.map(function(s){var key=code+'|'+s.num;var nb=(ctx.blocks||[]).filter(function(b){return b.seance_num===s.num}).length;
      return '<div class="acc-item'+(ui.open[key]?' open':'')+'" data-key="'+esc(key)+'"><div class="acc-head">'+
      (isStu?'<input type="checkbox" data-act="seance-check" data-num="'+esc(s.num)+'"'+(completed.indexOf(s.num)>=0?' checked':'')+'>':'')+
      '<button class="acc-trig" data-act="acc"><span class="l"><span class="num">'+esc(s.num)+'</span><span>'+esc(s.titre)+'</span>'+(nb?'<span class="tag">'+nb+' élément'+(nb>1?'s':'')+'</span>':'')+'</span>'+ic('chev')+'</button></div>'+
      '<div class="acc-body">'+seanceBody(s,code,ctx,user)+'</div></div>'}).join('')+'</div>';
  }
  h+='</div>';
  h+=livePane(base,user,ctx,edit);
  // Devoir
  var subs=ctx.subs||[];var d=base.devoir;
  h+='<div class="pane" data-pane="devoir"'+(ui.tab==='devoir'?'':' hidden')+'><div class="stack6">';
  if(d)h+='<div class="paper" style="padding:24px"><h3 class="serif" style="font-size:20px;font-weight:600">'+esc(d.titre)+'</h3><p class="sm muted" style="margin-top:8px;line-height:1.7">'+esc(d.desc)+'</p><div class="row xs muted" style="margin-top:12px;gap:16px">'+(d.echeance?'<span>Échéance : '+esc(d.echeance)+'</span>':'')+(d.ponderation?'<span>Pondération : '+esc(d.ponderation)+'</span>':'')+(d.format?'<span>Format : '+esc(d.format)+'</span>':'')+'</div></div>';
  var seanceDevoirs=(ctx.blocks||[]).filter(function(b){return b.kind==='devoir'});
  if(seanceDevoirs.length)h+='<div class="stack"><h4 class="sec-title">Devoirs par séance ('+seanceDevoirs.length+')</h4>'+seanceDevoirs.map(function(b){return '<div class="mono xs muted" style="margin-bottom:-6px">Séance '+esc(b.seance_num)+'</div>'+blockHTML(b,null,false)}).join('')+'</div>';

  var inp=function(l,k,ph){return '<div class="field"><label class="lbl">'+l+'</label><input class="input" data-c="'+k+'" placeholder="'+esc(ph||'')+'" value="'+esc(d[k])+'"></div>'};
  document.getElementById('modal-root').innerHTML='<div class="overlay" data-act="dlg-overlay"><div class="modal wide" role="dialog"><button class="x" data-act="dlg-close" aria-label="Fermer">×</button><h3>Nouveau cours</h3><div class="stack4">'+
   '<div class="grid" style="grid-template-columns:1fr 2fr;gap:12px">'+inp('Code du cours','code','ex. TS-501')+inp('Titre','title','Titre du cours')+'</div>'+
   '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px"><div class="field"><label class="lbl">Année / catégorie</label><select class="select" data-c="year">'+opt(YEARS,d.year)+'</select></div>'+
   '<div class="field"><label class="lbl">Axe</label><select class="select" data-c="axis">'+opt(DATA.axes||[],d.axis)+'</select></div>'+
   '<div class="field"><label class="lbl">Modalité</label><select class="select" data-c="mode">'+['asynchrone','synchrone','hybride'].map(function(m){return '<option value="'+m+'"'+(d.mode===m?' selected':'')+'>'+MODE_LABELS[m]+'</option>'}).join('')+'</select></div></div>'+
   '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">'+inp('Enseignant','prof')+inp('Crédits','credits')+inp('Horaire','schedule','ex. Jeudi 18 h – 21 h')+'</div>'+
   inp('Préalable (facultatif)','prereq')+inp('Lien de la salle virtuelle (facultatif)','room_url','https://')+
   '<div class="field"><label class="lbl">Description</label><textarea class="textarea" rows="4" data-c="desc">'+esc(d.desc)+'</textarea></div></div>'+
   '<div class="foot"><button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="course-save">Créer le cours</button></div></div></div>'}
async function saveCourseDialog(){
  var d=ui.courseDlg;var code=(d.code||'').trim();var title=(d.title||'').trim();
  if(!/^[A-Za-z0-9_-]{2,24}$/.test(code))return toast('Code invalide : 2 à 24 caractères (lettres, chiffres, - ou _).','ko');
  if(!title)return toast('Le titre est requis.','ko');
  if(allCourses().some(function(c){return String(c.code).toLowerCase()===code.toLowerCase()}))return toast('Ce code de cours existe déjà.','ko');
  if(d.room_url&&d.room_url.trim()&&!safeUrl(d.room_url))return toast('Lien de salle invalide.','ko');
  var data={code:code,title:title,year:d.year,axis:d.axis,credits:d.credits,prof:d.prof,schedule:d.schedule,prereq:d.prereq,desc:d.desc,mode:d.mode,room_url:safeUrl(d.room_url)||'',room_note:'',objectifs:[],
    seances:[{num:'01',titre:'Séance 1',desc:'',lectures:[],youtube:null}],devoir:null,custom:true};
  try{await S.saveCustomCourse(code,data)}catch(e){return fail(e)}
  state.custom[code]=data;toast('Cours créé','ok');closeDialog();go('#/cours/'+encodeURIComponent(code))}

/* ================= Rendu principal ================= */
var rtoken=0;
async function render(){
  var tk=++rtoken;var sy=window.scrollY;var r=route();var user=state.user;
  var app=document.getElementById('app');applyTheme(ui.settingsDraft&&route().name==='admin'?Object.assign(getSettings(),ui.settingsDraft):getSettings());
  if(!state.ready){app.innerHTML='<div class="center">Chargement…</div>';return}
  if(CLOUD&&!CLOUD_LIB_OK){app.innerHTML='<div class="center" style="padding:24px;text-align:center">La bibliothèque Supabase n\'a pas pu être chargée (connexion Internet ?). Rechargez la page.</div>';return}
  var key=r.name+(r.code||'');
  if(key!==ui.lastRoute){if(r.name!=='course'){ui.editing=false;ui.draft=null}ui.tab='seances';ui.lastRoute=key;sy=0;if(r.name!=='admin')ui.settingsDraft=null}
  if(r.name==='redirect'){location.hash=r.to;return}
  if(r.name==='login'&&user){location.hash='#/tableau-de-bord';return}
  if((r.name==='course'||r.name==='dash'||r.name==='admin')&&!user){location.hash='#/login';return}
  if(r.name==='admin'&&user.role!=='admin'){location.hash='#/';return}
  if(r.name==='course'&&!enrolled(user,r.code)){toast("Ce cours ne fait pas partie de vos cours : demandez l'accès à l'administrateur.",'ko');location.hash='#/tableau-de-bord';return}
  var ctx={},page='';
  try{
    if(r.name==='course'){
      var res=await Promise.all([S.blocks(r.code),S.progress(r.code),S.subs(r.code),S.forum(r.code)]);
      ctx.blocks=res[0];ctx.completed=res[1];ctx.subs=res[2];ctx.posts=res[3];ctx.urls=await S.fileUrls(ctx.blocks);
    }
    if(r.name==='admin'){ctx.profiles=await S.profiles();ctx.invites=await S.invites()}
    if(r.name==='dash'){ctx.live=await S.upcomingLive(user.role==='admin'?null:(user.course_codes||[]))}
  }catch(e){toast(e.message||'Erreur de chargement','ko')}
  if(tk!==rtoken)return;
  ui.ctx=ctx;
  if(r.name==='home')page=viewHome(user);
  else if(r.name==='login')page=viewLogin();
  else if(r.name==='dash')page=viewDash(user,ctx);
  else if(r.name==='admin')page=viewAdmin(ctx);
  else if(r.name==='course')page=viewCourse(user,r.code,ctx);
  app.innerHTML=navbar(user)+page;
  window.scrollTo(0,sy)}

/* ================= Événements ================= */
function fail(e){toast((e&&e.message)||'Erreur','ko')}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act');var user=state.user;var r=route();
  if(act==='dlg-overlay'){if(e.target!==el)return;return closeDialog()}
  if(act==='seance-check')return;
  (async function(){try{switch(act){
   case 'theme':var dark=document.documentElement.classList.toggle('dark');try{localStorage.setItem(THEME_KEY,dark?'dark':'light')}catch(x){}render();break;
   case 'logout':await S.logout();state.user=null;state.edits={};state.custom={};ui.authMode='login';ui.authMsg='';go('#/');break;
   case 'auth-mode':ui.authMode=el.getAttribute('data-v');ui.authMsg='';render();break;
   case 'scroll-cat':var c=document.getElementById('catalogue');if(c)c.scrollIntoView({behavior:'smooth'});break;
   case 'year':ui.year=el.getAttribute('data-v');render();break;
   case 'axis':ui.axis=el.getAttribute('data-v');render();break;
   case 'tab':ui.tab=el.getAttribute('data-v');
     document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-v')===ui.tab)});
     document.querySelectorAll('.pane').forEach(function(p){p.hidden=p.getAttribute('data-pane')!==ui.tab});break;
   case 'acc':var item=el.closest('.acc-item');item.classList.toggle('open');ui.open[item.getAttribute('data-key')]=item.classList.contains('open');break;
   case 'form-toggle':var box=el.closest('.blk').querySelector('.formbox');
     if(box.firstChild){box.innerHTML='';el.textContent=el.getAttribute('data-label')||'Afficher dans la page'}
     else{var lv=el.getAttribute('data-live')==='1';box.innerHTML='<iframe class="formframe" title="'+(lv?'Classe virtuelle':'Formulaire')+'"'+(lv?' allow="camera; microphone; fullscreen; display-capture; autoplay"':' loading="lazy"')+'></iframe>';box.firstChild.src=el.getAttribute('data-src');el.textContent=lv?'Quitter la salle (dans la page)':'Masquer le formulaire'}break;
   case 'edit-start':ui.draft=getCourse(r.code);ui.editing=true;render();break;
   case 'edit-cancel':ui.editing=false;ui.draft=null;render();break;
   case 'edit-save':
     if(!canEdit(user,r.code))return toast('Vous ne pouvez pas modifier ce cours','ko');
     var dr=ui.draft;var data={title:dr.title,prof:dr.prof,credits:dr.credits,schedule:dr.schedule,prereq:dr.prereq,desc:dr.desc,objectifs:dr.objectifs,seances:dr.seances,year:dr.year,axis:dr.axis,mode:dr.mode||'asynchrone',room_url:safeUrl(dr.room_url)||'',room_note:dr.room_note||''};
     await S.saveEdit(r.code,data);state.edits[r.code]=data;ui.editing=false;ui.draft=null;toast('Cours mis à jour','ok');render();break;
   case 'seance-add':var mx=(ui.draft.seances||[]).reduce(function(m,s){return Math.max(m,parseInt(s.num,10)||0)},0)+1;var n=String(mx);while(n.length<2)n='0'+n;
     ui.draft.seances=(ui.draft.seances||[]).concat([{num:n,titre:'Nouvelle séance',desc:'',lectures:[],youtube:null}]);render();break;
   case 'seance-del':var i=+el.getAttribute('data-i');var sd=ui.draft.seances[i];
     if(sd&&!confirm('Supprimer la séance '+sd.num+' ? Le contenu qui lui est rattaché ne sera plus affiché.'))return;
     ui.draft.seances=ui.draft.seances.filter(function(_,k){return k!==i});render();break;
   case 'blk-new':openBlockDialog(r.code,el.getAttribute('data-num'),null,el.getAttribute('data-kind')||undefined);break;
   case 'blk-edit':var b1=(ui.ctx.blocks||[]).find(function(b){return b.id===el.getAttribute('data-id')});if(b1)openBlockDialog(r.code,b1.seance_num,b1);break;
   case 'blk-del':var b2=(ui.ctx.blocks||[]).find(function(b){return b.id===el.getAttribute('data-id')});if(!b2)return;
     if(!confirm('Supprimer cet élément de contenu ?'))return;await S.deleteBlock(b2);toast('Contenu supprimé','ok');render();break;
   case 'blk-save':await saveBlockDialog();break;
   case 'sub-send':var ta=document.getElementById('sub-text');var tx=(ta.value||'').trim();if(!tx)return;
     await S.addSub(r.code,tx);toast('Devoir soumis','ok');render();break;
   case 'grade':var sub=(ui.ctx.subs||[]).find(function(s){return String(s.id)===el.getAttribute('data-id')});if(!sub)return;
     if(!canEdit(user,sub.code||sub.course_code))return toast('Accès refusé','ko');
     var g=prompt('Note (ex: 18/20) :');if(g==null)return;var fb=prompt('Commentaire (optionnel) :')||'';
     await S.grade(sub.id,g,fb);toast('Note enregistrée','ok');render();break;
   case 'forum-post':await postForum();break;
   case 'user-new':openDialog(null);break;
   case 'pw-gen':if(ui.dialog){var ch='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(10),pw='';crypto.getRandomValues(a);for(var gi=0;gi<10;gi++)pw+=ch[a[gi]%ch.length];ui.dialog.password=pw;renderDialog()}break;
   case 'user-edit':openDialog((ui.ctx.profiles||[]).find(function(u){return u.id===el.getAttribute('data-id')}));break;
   case 'user-del':var u=(ui.ctx.profiles||[]).find(function(x){return x.id===el.getAttribute('data-id')});if(!u)return;
     if(u.id===user.id)return toast('Impossible de supprimer votre propre compte','ko');
     if(!confirm('Supprimer '+(u.name||u.email)+' ?'))return;
     await S.deleteProfile(u.id);toast('Utilisateur supprimé','ok');render();break;
   case 'inv-del':await S.deleteInvite(el.getAttribute('data-id'));toast('Invitation retirée','ok');render();break;
   case 'admin-tab':ui.adminTab=el.getAttribute('data-v');if(ui.adminTab!=='site')ui.settingsDraft=null;render();break;
   case 'course-new':openCourseDialog();break;
   case 'course-save':await saveCourseDialog();break;
   case 'course-del':var cc=el.getAttribute('data-code');if(!confirm('Supprimer le cours '+cc+' et tout son contenu (séances, documents) ?'))return;
     await S.deleteCustomCourse(cc);delete state.custom[cc];delete state.edits[cc];toast('Cours supprimé','ok');render();break;
   case 'settings-save':var sd2=ui.settingsDraft;var out=Object.assign({},sd2);out.objectives=(sd2.objectives_text||'').split('\n').map(function(x){return x.trim()}).filter(Boolean);delete out.objectives_text;
     await S.saveSettings(out);state.settings=out;ui.settingsDraft=null;toast("Page d'accueil enregistrée",'ok');render();break;
   case 'settings-reset':if(!confirm("Rétablir les textes et couleurs d'origine ?"))return;await S.saveSettings({});state.settings={};ui.settingsDraft=null;toast('Valeurs par défaut rétablies','ok');render();break;
   case 'jitsi-gen':if(ui.blockDlg){ui.blockDlg.url=jitsiUrl(ui.blockDlg.code);var ue=document.querySelector('[data-b=url]');if(ue)ue.value=ui.blockDlg.url}break;
   case 'dlg-close':closeDialog();break;
   case 'dlg-save':await saveDialog();break;
  }}catch(err){fail(err)}})()});
async function postForum(){var r=route();var inp=document.getElementById('forum-input');if(!inp)return;var t=inp.value.trim();if(!t)return;
  try{await S.addForum(r.code,t);render()}catch(e){fail(e)}}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='forum-input'){e.preventDefault();postForum()}if(e.key==='Escape'&&(ui.dialog||ui.blockDlg||ui.courseDlg))closeDialog()});
document.addEventListener('submit',function(e){
  if(e.target.id!=='login-form')return;e.preventDefault();
  var errBox=document.getElementById('login-err');var btn=document.getElementById('login-btn');
  var email=document.getElementById('email').value.trim().toLowerCase();var pw=document.getElementById('password').value;
  var su=ui.authMode==='signup'&&S.mode==='cloud';var nameEl=document.getElementById('name');
  btn.disabled=true;
  (async function(){try{
    if(su){var rs=await S.signup((nameEl.value||'').trim(),email,pw);
      if(rs.needsConfirm){ui.authMode='login';ui.authMsg='Compte créé. Vérifiez votre courriel pour confirmer votre adresse, puis connectez-vous.';render();return}
      state.user=rs.user;
      if(!state.user){errBox.innerHTML='<div class="err">Profil introuvable après inscription. Contactez l\'administrateur.</div>';btn.disabled=false;return}
    }else{state.user=await S.login(email,pw)}
    await loadShared();
    ui.authMsg='';go('#/tableau-de-bord');
  }catch(err){errBox.innerHTML='<div class="err">'+esc(err.message)+'</div>';btn.disabled=false}})()});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='course-search'){ui.q=t.value;document.getElementById('grid').innerHTML=gridHTML();return}
  if(t.id==='user-search'){ui.adminQ=t.value;document.getElementById('users-table').innerHTML=usersTable();return}
  if(t.hasAttribute('data-bind')&&ui.draft){ui.draft[t.getAttribute('data-bind')]=t.value;return}
  if(t.hasAttribute('data-seance')&&ui.draft){ui.draft.seances[+t.getAttribute('data-i')][t.getAttribute('data-seance')]=t.value;return}
  if(t.hasAttribute('data-b')&&ui.blockDlg){ui.blockDlg[t.getAttribute('data-b')]=t.value;return}
  if(t.hasAttribute('data-c')&&ui.courseDlg){ui.courseDlg[t.getAttribute('data-c')]=t.value;return}
  if(t.hasAttribute('data-s')&&ui.settingsDraft){ui.settingsDraft[t.getAttribute('data-s')]=t.value;
    if(t.type==='color'){var cd=t.parentNode.querySelector('code');if(cd)cd.textContent=t.value;applyTheme(Object.assign(getSettings(),ui.settingsDraft))}return}
  if(t.hasAttribute('data-d')&&ui.dialog&&t.tagName==='INPUT'){ui.dialog[t.getAttribute('data-d')]=t.value;return}});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='role-filter'){ui.adminRole=t.value;document.getElementById('users-table').innerHTML=usersTable();return}
  if(t.tagName==='SELECT'){
    if(t.hasAttribute('data-bind')&&ui.draft){ui.draft[t.getAttribute('data-bind')]=t.value;return}
    if(t.hasAttribute('data-b')&&ui.blockDlg){ui.blockDlg[t.getAttribute('data-b')]=t.value;return}
    if(t.hasAttribute('data-c')&&ui.courseDlg){ui.courseDlg[t.getAttribute('data-c')]=t.value;return}}
  if(t.hasAttribute('data-bkind')&&ui.blockDlg){ui.blockDlg.kind=t.value;ui.blockDlg.file=null;renderBlockDialog();return}
  if(t.hasAttribute('data-bfile')&&ui.blockDlg){ui.blockDlg.file=(t.files&&t.files[0])||null;
    if(ui.blockDlg.file&&!ui.blockDlg.title){var ti=document.querySelector('[data-b=title]');var nm=ui.blockDlg.file.name.replace(/\.[^.]+$/,'');if(ti){ti.value=nm;ui.blockDlg.title=nm}}return}
  if(t.hasAttribute('data-d')&&ui.dialog&&t.tagName==='SELECT'){ui.dialog[t.getAttribute('data-d')]=t.value;renderDialog();return}
  if(t.hasAttribute('data-code')&&ui.dialog){var c=t.getAttribute('data-code');var a=ui.dialog.codes;var k=a.indexOf(c);
    if(t.checked&&k<0)a.push(c);if(!t.checked&&k>=0)a.splice(k,1);document.getElementById('code-count').textContent=a.length;return}
  if(t.getAttribute&&t.getAttribute('data-act')==='seance-check'){var r=route();var num=t.getAttribute('data-num');var done=t.checked;
    (async function(){try{await S.setProgress(r.code,num,done);
      var set=await S.progress(r.code);var total=(getCourse(r.code).seances||[]).length;var pct=total?Math.round(set.length/total*100):0;
      var bar=document.querySelector('.progress i');if(bar)bar.style.width=pct+'%';
      var lab=document.getElementById('prog-label');if(lab)lab.textContent=pct+'% · '+set.length+'/'+total+' séances';
    }catch(err){t.checked=!done;fail(err)}})()}});
window.addEventListener('hashchange',render);

(async function boot(){
  try{
    if(CLOUD&&!CLOUD_LIB_OK){state.ready=true;render();return}
    await loadSettings();applyTheme(getSettings());
    state.user=await S.init();
    if(state.user)await loadShared();
  }catch(e){console.error(e)}
  state.ready=true;render();
})();
render();
})();

</script>
